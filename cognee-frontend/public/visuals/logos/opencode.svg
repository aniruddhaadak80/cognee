<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="opencode-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="opencode-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4AA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099CC;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#opencode-gradient)" stroke="url(#opencode-accent)" stroke-width="2"/>

  <!-- Terminal window -->
  <rect x="24" y="30" width="80" height="68" rx="4" fill="#0F0F1A" stroke="url(#opencode-accent)" stroke-width="1.5"/>

  <!-- Window controls -->
  <circle cx="32" cy="40" r="5" fill="#FF5F57"/>
  <circle cx="46" cy="40" r="5" fill="#FFBD2E"/>
  <circle cx="60" cy="40" r="5" fill="#28CA42"/>

  <!-- Terminal content -->
  <text x="36" y="64" font-family="monospace" font-size="16" font-weight="600" fill="#00D4AA">></text>
  <text x="58" y="64" font-family="monospace" font-size="16" font-weight="600" fill="#FFFFFF">opencode</text>

  <!-- Cursor -->
  <rect x="130" y="56" width="8" height="20" fill="#00D4AA" opacity="0.8">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Prompt line -->
  <text x="36" y="88" font-family="monospace" font-size="12" fill="#8888AA">~/project $</text>
  <text x="110" y="88" font-family="monospace" font-size="12" fill="#00D4AA">_</text>

  <!-- AI indicator -->
  <circle cx="100" cy="22" r="12" fill="url(#opencode-accent)" opacity="0.9"/>
  <text x="100" y="26" font-family="monospace" font-size="14" font-weight="bold" fill="#0F0F1A" text-anchor="middle">AI</text>
</svg>
